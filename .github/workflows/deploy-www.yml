---
name: "deploy www"

on:
  push:
    branches:
      - master
    paths:
      - "www/**"
      - "!www/.prettierrc.mjs"
      - "docs/**"
      - ".github/workflows/deploy-www.yml"
  pull_request:
    # ready_for_review builds a draft PR once it's marked ready
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "www/**"
      - "!www/.prettierrc.mjs"
      - "docs/**"
      - ".github/workflows/deploy-www.yml"
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time, PR builds are cancelled when superseded
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('www-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Draft PRs don't build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: www
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: www/dist

  deploy:
    needs: build
    # Manual dispatch or push to master triggers deployment
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
